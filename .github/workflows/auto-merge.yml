name: Auto-Merge Validated PRs

on:
  workflow_run:
    workflows: ["Validate Adblock List"]
    types:
      - completed

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve PR Number
        id: pr_info
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" --json number --jq '.[0].number' || echo "")
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR found for commit ${{ github.event.workflow_run.head_sha }}. Skipping merge (likely a direct push)."
            echo "skip_merge=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Mergeability
        if: ${{ steps.pr_info.outputs.skip_merge != 'true' }}
        id: check
        run: |
          PR_NUM=${{ steps.pr_info.outputs.pr_number }}
          MERGEABLE=$(gh pr view $PR_NUM --json mergeable --jq '.mergeable')
          
          if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
            echo "PR #$PR_NUM has conflicts. Cannot auto-merge."
            exit 1
          fi
          
          echo "PR #$PR_NUM is mergeable."

      - name: Enable Auto-Merge
        if: ${{ steps.pr_info.outputs.skip_merge != 'true' }}
        run: |
          PR_NUM=${{ steps.pr_info.outputs.pr_number }}
          gh pr merge $PR_NUM --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Auto-merge workflow failed. Please check logs."
